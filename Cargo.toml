[workspace]
resolver = "3"
members = ["crates/chequer-core", "crates/chequer-app"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4

# Fast build for testing: optimized, no LTO.
[profile.fastrel]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
