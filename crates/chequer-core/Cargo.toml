[package]
name = "chequer-core"
description = "Chequer core: document, layers, selection, history and rasterization. No UI or GPU."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tiny-skia = "0.12"
skrifa = "0.44"
harfrust = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tga", "tiff", "ico"] }
crc32fast = "1.5.4"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
flate2 = "1.1.11"
roxmltree = "0.21.2"
base64 = "0.23.1"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
zstd = "0.13"
lz4_flex = "0.11"
rayon = "1.11"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
