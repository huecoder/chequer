name: Feature request
description: Suggest a tool, effect, format or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task you are stuck on, not the solution
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today
      description: Workarounds, or how other editors handle it
