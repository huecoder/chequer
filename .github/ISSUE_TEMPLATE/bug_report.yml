name: Bug report
description: Something works wrong or crashes
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the About dialog
      placeholder: "0.5.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: extras
    attributes:
      label: Screenshots, files, input device
      description: Drag files here. For pen problems name the tablet or stylus.
